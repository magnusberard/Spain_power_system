[islands]
# ── Balearic plants in the market stages ─────────────────────────────────────
# The Balearic Islands are a non-peninsular electricity system (RD 738/2015):
# REE dispatches ALL island plants (thermal, renewable, waste) and they are paid
# a regulated price; none of them sells in OMIE's peninsular market. OMIE's unit
# list has no Balearic power plant, and its Spanish coal units are only Aboño 1-2,
# Los Barrios and Soto 3. What OMIE does have are purchase units for the HVDC
# link ("CUR ENLACE BALEARES"): the power the link (Morvedre/Sagunto – Mallorca,
# line LTGES0254) carries is bought on the mainland, as demand, and is already
# inside the OMIE load the model runs on.
#
# generations.csv still puts the island plants on the Mallorca buses (the Menorca
# and Ibiza plants included: those islands have no buses of their own), and the
# copper-plate market stages have no network, so they offer these plants to the
# peninsular market as if they stood on the mainland: 31 units, 2 094 MW
# (gas 1 524, coal 260, PV 272, waste 38).
#
# exclude_from_market = true, for every unit on the buses below:
#   • market stages (DA, ID2, ID3, CID, balancing): held at 0 MW;
#   • redispatch: kept and never frozen at a market set-point, so Mallorca stays
#     an island grid behind the HVDC link: the link brings what it can and the
#     redispatch runs the island plants for the rest. That output counts as
#     upward redispatch, which REE's peninsular redispatch figures do not include.
# And in every stage, because the inputs are OMIE's (peninsular):
#   • the solar/wind series is shared over mainland units only (an island unit
#     gets the same capacity factor without taking a share of the peninsula's);
#   • the coal availability factor (peak OMIE coal ÷ 2 900 MW, which counts the
#     island coal in) is rescaled to the 2 640 MW mainland coal fleet;
#   • the [chp] blocks are not sited on these buses.
# false = the original behaviour.
exclude_from_market = false
# The 10 Mallorca buses (the only island buses; LTGES0254 lands on ES00683).
buses = ["ES00285", "ES00286", "ES00287", "ES00288", "ES00289",
         "ES00290", "ES00291", "ES00292", "ES00683", "ES00784"]

# ── Ceuta ────────────────────────────────────────────────────────────────────
# Ceuta is an isolated system too, with no link to the mainland in 2024: REE
# began building the 132 kV Algeciras–Ceuta link in June 2024 and laid its first
# submarine cable in September 2025. Its plant is not an OMIE unit and the OMIE
# load has no Ceuta demand. generations.csv lists it (G0116, "Ceuta power
# station", 83 MW, as a gas turbine) at its Ceuta coordinates but attached to
# Algeciras (ES00190), the nearest bus across the Strait, so the model treats it
# as a mainland plant in every stage.
# remove_isolated = true leaves the listed units out of every stage, market and
# redispatch. For runs after the link is in service, model Ceuta's demand and
# the link instead of putting the plant back on the mainland.
remove_isolated = false
isolated_units = ["G0116"]   # Ceuta

[chp]
# ── Industrial cogeneration / waste / mini-hydro ─────────────────────────────
# OMIE clears this fleet as a single market group, "Cogeneración / Residuos /
# Mini hidráulica" (3.4 GWh/h on 8 Jul, 3.9 on 2 Dec).  generations.csv has no
# equivalent at all — 493 MW of Biomass — so without this block the model has to
# cover ~3.5 GW of real supply with CCGTs, which is most of its CCGT error.
#
# Sizing comes from splitting the OMIE group against ENTSO-E's fuel-based
# metering (see Paper section 5.1); figures are for the two study days:
#   waste     = ENTSO-E Biomass + Waste                  → 17.6 / 15.5 GWh/day
#   minihydro = ENTSO-E Hydro(+pump) − OMIE Hydropower   → 10.1 / 8.3 GWh/day
#   gas CHP   = OMIE group − waste − minihydro           → 54 / 70 GWh/day
# Divided by 24 h these give the MW blocks below, so the three blocks always
# add up to the OMIE group.  Gas CHP is NOT "ENTSO-E Fossil Gas − OMIE cleared
# CCGT": ENTSO-E's gas is actual output and includes the CCGTs committed after
# the day-ahead, which comes out 1.8–2.4× too high on both study days.  The
# mini-hydro figure is an upper bound: that residual also absorbs intraday
# hydro adjustment, which is why it comes out (implausibly) larger in July than
# in December — and gas CHP, as the remainder, inherits that error (e.g.
# 30 MW on 2024-04-06, when mini-hydro comes out at 1 927 MW).
# Per-day values: omie_conversion/add_chp_calibration.py.
enabled = true

# National block sizes [MW] for any day without a [chp.by_date] entry.
gas_mw       = 2600.0
waste_mw     =  700.0
minihydro_mw =  400.0

# Offer price of the gas CHP block [EUR/MWh].  NOT its fuel cost: the host
# process buys the steam, so most of the gas is charged to heat rather than to
# electricity, and RECORE support lowers the break-even pool price further.
# Calibrated from the July data — the block held 3 115 MW at a pool price of
# 32 EUR/MWh, so its offer must sit below that; there is no 2024 study-day
# observation below 32, hence the round 22.  The unit still carries fuel = "Gas"
# so emissions accounting is unaffected by the low offer price.
gas_cost_eur_mwh = 22.0
# Technical minimum as a fraction of the block, set by the process steam demand
# that cannot be interrupted.  From the observed July trough: the group fell to
# 3 110 MW against a 3 410 MW mean, i.e. the gas part fell to ~0.86 of its mean.
gas_min_frac = 0.86

# Waste-to-energy, biomass and mini-hydro run on ~zero marginal cost and show no
# price response at all in the OMIE data (flat within ±10 % across a 3x price
# swing), so they are near-must-run.
waste_cost_eur_mwh     = 0.0
waste_min_frac         = 0.90
minihydro_cost_eur_mwh = 0.0
minihydro_min_frac     = 0.90

# Siting: spread each block over this many largest demand buses, weighted by
# demand.  Irrelevant to the copper-plate market stages; it decides where the
# AC redispatch sees the injection.  Industrial CHP sits at industrial sites,
# so concentrating beats spreading over all 1 057 load buses.
siting_buses = 100

