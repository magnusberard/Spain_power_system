[id2]
# ── Stage 2: Intraday market — second gate ───────────────────────────────────
# Same copper-plate formulation as DA.  Uses ES_old col "-12" scaled by the ID2
# factor from the new probabilistic files.  Nuclear units are frozen at their
# DA dispatch for this and all subsequent stages.  (ID1 / first intraday gate
# is not modelled.)
enabled = true

[id3]
# ── Stage 3: Intraday market — third gate ────────────────────────────────────
# Closes 10:00 on the delivery day and trades ONLY the last 12 delivery hours
# (12–23), scaled by the ID3 factor.  Hours 0–11 are not retradeable here and
# keep their ID2 schedule; their reservoir use is locked, so ID3 only reallocates
# the remaining water across hours 12–23 against the Bellman cost-to-go.  Nuclear
# units remain frozen at their DA dispatch.  Requires [id2].enabled = true.
enabled = true

[cid]
# ── Stage 4: Continuous Intraday market ──────────────────────────────────────
# Modelled as auction gates closing one hour before each delivery hour.  For each
# hour we re-clear the remaining horizon with all earlier hours frozen at their
# committed CID value, then commit this hour (24 rolling solves/day).  Earlier
# hours' reservoir use is locked, so water cannot be reallocated backwards in
# time.  Uses the CID-scaled profiles; the committed schedule anchors the
# redispatch.  For the first 12 hours its predecessor is ID2 (no ID3 there).
enabled = true

[balancing]
# ── Stage 5: Balancing market ────────────────────────────────────────────────
# Final adjustment market, cleared after the continuous intraday and just before
# the network redispatch.  Same copper-plate formulation as the intraday gates:
# all 24 hours are tradable and anchored to the CID schedule with minimum
# movement (cost-optimal first, then least deviation), so it only adjusts the
# dispatch to cover the balancing forecast update.  Probabilistic load/solar/wind
# changes are read from the "BE" column of the new ES files (ES_old col "-12" ×
# BE factor).  Nuclear stays frozen at its DA dispatch.  The cleared balancing
# schedule — and the BE profiles — anchor the redispatch.  Requires [da].enabled.
enabled = true

[crossborder]
# Fix the market-cleared FR/PT import/export schedule at the border buses.
# Reads Data/crossborder.csv and injects each country's net exchange as a
# costless fixed generator at the foreign terminal buses (disaggregated
# proportionally to line thermal ratings).
# Weeks mode: must be off — crossborder.csv only covers the 2024 study days;
# sampled-week exchange arrives with the 4-zone DA clearing.
enabled = true

# ── Where the EXPORT sits ───────────────────────────────────────────────────
# THE EXPORT IS ALREADY INSIDE THE ES LOAD SERIES — it must be RELOCATED, never
# added.  Evidence: Data/OMIE/actual_generation_*.csv balances its generation
# columns plus the FR import column against EXACTLY the load series this model
# uses (Data/ES_old/load, col "-12"), to 0.0 GWh, in all 48 study hours, with no
# Portugal term anywhere.  Adding the export on top instead BREAKS that balance:
# it puts 59-60 GWh/day of demand into the day-ahead that does not exist, and
# every MWh of it lands on CCGT (8 Jul: 2.7 -> 60.6 GWh against 0.4 GWh actually
# cleared by OMIE).  See docs/method_export_relocation.md.
#
# What is still wrong with `false` is purely SPATIAL.  The export energy is
# spread over the 1 227 Spanish load buses in proportion to demand, so it is
# consumed in Madrid/Barcelona/Valencia instead of leaving through the border:
# in the AC redispatch the PT border lines carry 5-10 MW against a real 692-3 899
# MW export, and the FR border lines carry exactly 0 MW in the six hours of
# 8 July when Spain was exporting to France.
#
# false — legacy behaviour: hours with a net export are dropped entirely, so the
#   FR/PT terminal buses are idle (no load, no generation) in those hours.
# true  — the export MW is SUBTRACTED from the load distributed over the Spanish
#   buses and placed as a fixed WITHDRAWAL (pmin = pmax < 0) at the FR/PT
#   terminal buses, split by line thermal rating.  Total load is unchanged, so
#   the copper-plate market gates (DA/ID2/ID3/CID/BAL) clear IDENTICALLY; only
#   the AC redispatch, which is the one stage that cares where power leaves the
#   country, sees a difference.  Also keeps the XB generator keys stable across
#   a border that flips sign in-day.
#
# Weeks mode is unaffected: there the ES demand comes from EMPIRE ScenarioData
# and does NOT contain the exchange, so the 4-zone DA's cleared export is a
# genuine addition and is always modelled.
export_at_border = true

# ── Where the schedule comes from ───────────────────────────────────────────
# "observed" — Data/crossborder.csv, the settled 2024 exchange of the two study
#   days.  Exogenous to the model but consistent with the day being reproduced.
# "sddp"     — the mid-term model's OWN cleared exchange, from the hourly
#   Data/ExchangeSchedule_sddp4.csv that midterm_sddp4.jl writes next to the
#   turbine schedule.  This closes the seam where the mid-term optimises
#   exchange within NTC and the DA then overwrites it with observed values.
#   BUT: the mid-term clears against EMPIRE/EDF climate-year weather rather than
#   the actual weather of a 2024 calendar day, and its ES-FR flow sits ON the
#   2 800 MW NTC bound in ~90 % of blocks (zonal LP with no hurdle cost).  On
#   2 Dec 2024 it exports ~2.2-2.7 GW to France where the real day imported
#   ~1.9-2.7 GW — the sign is inverted.  Use it for a self-consistent
#   mid-term -> DA chain, NOT for reproducing a historical day.
source = "observed"

# ── Stage 2: Redispatch ──────────────────────────────────────────────────────
[redispatch]
# Make the CID schedule network-feasible with a full AC OPF anchored to the
# CID dispatch.  Units in frozen_fuels are pinned at their CID set-point
# (pmin = pmax); every other unit (by default: Gas, Oil, reservoir & run-of-
# river hydro, pumped hydro, Li-Ion BESS within ±rated power, plus curtailable
# Wind and Solar) is free to be re-dispatched around its anchored market
# schedule.
#   enabled = false → run the day-ahead stage only.
# The CHP / waste / mini-hydro blocks are frozen at their cleared set-point too:
# cogeneration follows process heat and mini-hydro follows the river, so neither
# offers redispatch.
enabled = true

# Which technologies are pinned (pmin = pmax = P_DA) at this stage instead of
# being freely re-dispatchable.  A bare fuel name freezes every technology
# under it; "Fuel:technology" freezes only that one (Hydro splits into
# reservoir / pumped_storage / run_of_river — see generations.csv).
#   Nuclear, Biomass, Coal — no redispatch flexibility offered in practice.
# Run-of-river hydro is NOT frozen by default: an EMPIRE 2035 scenario can
# inflate an existing run-of-river unit's nameplate several-fold (it is
# site-bound, so the nodal disaggregation has nowhere else to put a region's
# growth — see empire_nodal.jl), and pinning that inflated MW makes the local
# network infeasible with no way to relieve it. Add "Hydro:run_of_river" here
# to restore the old fully-frozen behaviour once the grid can actually carry it.
frozen_fuels = ["Nuclear", "Biomass", "Coal"]
# down_only: fuels or technologies that, instead of frozen at the schedule, may be turned down but not
# up in the redispatch (pmax = schedule; pmin = CHP blocks' min_frac, others down_only_min_frac ×
# installed). REE turned down 0.8 TWh of CHP and 0.9 TWh of nuclear in 2024's phase I/II (I90).
# Priced by [redispatch.bids] (nuclear's fitted down mark-up 1.0: no refund, so a last resort).
# [] = as before.  Realism runs: ["Nuclear", "CHP", "CHP_Waste"].
down_only          = []
down_only_min_frac = 0.5

# ── Manual, targeted line reinforcement ─────────────────────────────────────
# A CSV (columns: line_id,factor) naming individual branches — AC lines,
# transformers ("TR_…") or HVDC links — to uprate, so a study can relieve a few
# corridors without moving the blanket `line_rating_factor` for the other ~2 300.
# Produced by the workflow in docs/method_grid_reinforcement_identification.md:
# probe at a high, uncongested line_rating_factor, back out each branch's
# req_factor from its peak loading, keep the ones above the target operating
# factor.
#
# `factor` is the branch's required ABSOLUTE rating as a fraction of NOMINAL
# (i.e. the req_factor itself: 1.4 = needs 140 % of nameplate), independent of
# the current derate — run_market_chain.jl divides by line_rating_factor to get the
# multiplier the model applies.
#
# Modelled as a THERMAL UPRATE (reconductoring): only rate_a moves. This is
# deliberately NOT the parallel-circuit model EMPIRE's own corridor investment
# uses, which would also multiply the branch's shunt charging and divide its
# reactance — on an AC solve that injects a large amount of extra reactive
# power and redraws the flow pattern, so raising the factors made the reactive
# balance worse instead of relieving the overload.
#   "" (default) — no manual override.
# Set this to a reinforcement.csv produced by scripts/run_reinforcement.sh to
# apply a derived reinforcement list.  Data/trinity_line_reinforcement_gt0.8.csv
# is the list derived FOR TRINITY -- it is not valid for another scenario.
extra_line_scale_file = ""

# Network model used to make the anchored schedule feasible:
#   "AC" — full nonlinear AC OPF (Ipopt): bus voltages, reactive power and the
#          apparent-power (MVA) thermal / generator-capability limits are all
#          enforced.  This is the reactive-realism path.
#   "DC" — linear DC OPF: active power and bus angles only.  Voltages and
#          reactive power are not modelled, thermal limits act on the active
#          (MW) flow, and the [network].voltage_band, [reactors], [load] and
#          [generators] reactive knobs have no effect.  Much faster and feasible
#          in cases where the AC problem is not, at the cost of reactive/voltage
#          security.  Being linear (LP/convex QP with the quadratic anchor), it
#          is solved exactly with Gurobi instead of Ipopt.
power_flow = "AC"

# Reservoir hydro opportunity cost during redispatch:
#   "constant"  — binding cut slope at V_ES_start used as a fixed marginal cost
#                 (EUR/MWh); each hour solved independently (fast).
#   "piecewise" — full Bellman cuts coupling all 24 hours in one AC OPF (slow,
#                 mirrors the DA hydro treatment).
water_value = "constant"

# How the redispatch is allowed to deviate from the DA schedule:
#   "quadratic"     — min  base_cost + anchor_weight · Σ (P_g − P_DA_g)²  [MW²].
#                     Larger anchor_weight ⇒ closer to DA; smaller ⇒ cheaper
#                     redispatch allowed.  Simple, well-conditioned (default).
#   "cost_weighted" — min  Σ c_g · (Δup_g + Δdown_g),  P_g = P_DA_g + Δup − Δdown.
#                     Minimises the real cost of redispatch; reservoir Δ priced
#                     at the water value.
objective     = "quadratic"
anchor_weight = 0.8

# How the cross-border exchange is placed on the FR/PT border buses:
#   "fixed"         — each border bus takes a fixed share of its country's
#                     exchange, by line rating.  Hours above ~2.7 GW to or from
#                     France are infeasible: the Arkale line's share cannot pass
#                     the 240 MW transformer behind it (TR_65a15878).
#   "country_total" — the exchange per country stays fixed; the redispatch picks
#                     the split over the border buses, each within its line
#                     rating × line_rating_factor and all in one direction, with
#                     a small penalty for moving away from the rating split.
crossborder_split = "country_total"

# Transmission losses already in the demand (step RD1/RD2 of redispatch_realism/).
# OMIE demand is bought at power-plant busbars with loss coefficients (Orden
# ITC/3353/2010), so it contains the losses; the AC load flow adds them again and
# the redispatch then reports them as energy turned up (2.8 TWh in 2024).  The
# redispatch load is scaled by (1 − loss_share).  Only the redispatch: the market
# stages keep the full demand.
#   0.0     — off (the previous behaviour).
#   ~0.010  — the model's own AC loss share in December 2024
#             (python redispatch_realism/settle.py results/<run> prints it).
# Leave at 0.0 for 2035 weeks runs: EMPIRE demand is not an OMIE busbar figure.
loss_share = 0.0

# Reactive power only from equipment that is running (step RD3).  Off, a
# synchronous unit the schedule leaves at 0 MW still gives its full rated
# reactive power, and every load-shedding unit gives ±(its load) of reactive
# power while shedding nothing: in December 2024 those two supplied most of the
# reactive power, so voltage control never made the model start a plant (REE's
# largest redispatch cause, 45 % of phase I up).
#   q_requires_online — true: a synchronous unit scheduled below
#                       q_online_min_frac × installed gives no reactive power;
#                       load shedding gives |Q| ≤ P·tan(acos(power_factor)).
#   q_condenser_ok    — "Fuel" or "Fuel:technology" entries that may still give
#                       reactive power at 0 MW (synchronous-condenser mode).
q_requires_online = false
q_online_min_frac = 0.01
q_condenser_ok    = []

# Run the network load flow (this redispatch stage) on its own, reusing the
# market schedule from a PREVIOUS run instead of clearing stages 1–5 again.
#   ""    — run the full chain (day-ahead → … → balancing → redispatch).
#   "BAL" — skip the market stages and anchor the load flow to the saved
#           results/<label>/bal_dispatch.csv; likewise "CID"/"ID3"/"ID2"/"DA".
# The Bellman water value is recomputed each run (cheap, clearing-independent).
# The saved *_dispatch.csv it reads are left untouched; only the redispatch
# outputs (summary/gen_dispatch/branch_flows/fuel_mix/bus_voltages) are rewritten.
from_saved = ""

# Restrict the load flow to a single delivery hour (or a single day).
#   ""             — every hour of every target day.
#   "2024-07-08 14" — only 14:00 on 2024-07-08 (needs water_value = "constant").
#   "2024-07-08"    — all 24 hours of that day only.
# Pins TARGET_DAYS too, so the market stages / Bellman pre-compute skip the
# other day. NOTE: a single-hour run rewrites the redispatch output CSVs with
# just that hour — copy them off first if you need the full-day results.
only = ""

[redispatch.startups]
# Voltage start-ups (step RD9, redispatch_startups.jl).  With q_requires_online
# the low-load hours cannot hold voltage; REE then starts combined cycles or coal
# at minimum load (phase I).  When an hour fails, a priced reactive slack shows
# where reactive power is missing, the cheapest offline candidate closest to it
# is started at minimum load, and the hour is solved again.  Minimum loads and
# start-up costs come from [unit_commitment] and [unit_commitment.coal].
# Started units are written to rd_startups.csv.  Needs q_requires_online = true,
# power_flow = "AC", water_value = "constant".
enabled              = false
candidates           = ["Gas:Combined_cycle", "Coal"]
candidate_min_mw     = 100.0     # industrial "combined cycles" below this are never started
max_rounds           = 8         # start-ups per hour at most
max_hops             = 4         # branches between the need and the unit
q_slack_eur_per_mvar = 1000.0    # price of the diagnostic reactive slack
min_slack_mvar       = 5.0       # slack below this counts as no need

[redispatch.mustrun]
# Must-run by voltage zone (step RD5), from REE's 2024 I90 data
# (redispatch_realism/build_voltage_zones.py): in every hour where REE raised a
# unit of a zone for voltage, at least as many of the zone's thermal units must
# run as REE had online (its viable programme, PDVP).  Offline CCGT/coal members
# are started at minimum load, cheapest first; nuclear counts but is never
# started.  Starts go to rd_startups.csv (round = 0).  Needs q_requires_online.
# 2024 only: the requirement is observed, not derived.
enabled          = false
zones_file       = "redispatch_realism/data/voltage_zone_units.csv"
requirement_file = "redispatch_realism/data/voltage_zone_requirement.csv"
scale            = 1.0      # sensitivity: multiplies every zone's count
# realtime = false: the zones apply in phase I only (with [redispatch.phase1].ac_check, voltage is
# handled in phase I, as REE does); true = also in real time (as before 25 Oct).
realtime         = true

[redispatch.phase1]
# REE's phase I/II as a daily stage on the day-ahead schedule (step RD8,
# redispatch_phase1.jl): one 24-hour DC unit commitment per day — offline
# CCGT/coal get on/off decisions (minimum load, start-up cost, minimum up/down
# times from [unit_commitment]), REE's cost rule ([redispatch.bids], down
# refunded at the day-ahead price), the [redispatch.mustrun] zone counts as
# constraints.  Solved with Gurobi; writes rd_phase1.csv and
# rd_phase1_summary.csv.  The units it commits stay committed in the real-time
# AC stage.  Needs q_requires_online; in a standalone run (from_saved) it reads
# the saved da_dispatch.csv.
enabled            = false
mip_gap            = 1e-3
time_limit_s       = 600.0
zone_shortfall_eur = 1.0e5     # penalty per missing unit in a voltage zone
# Fix 2 (2024 only, like RD5): units REE raised in phase I on at least half the days of 2024 are
# required in the hours REE raised them (build_unit_requirement.py --min-days 183: Aboño 2, Cartagena 1,
# Besós 5, San Roque 2, Aceca 4, Bahía de Bizkaia, As Pontes 5). "" = off.
unit_requirement_file = ""
# security_limits (in_chain only): REE's limits on phase I/II's changes in the gates after the DA (P.O. 3.2;
# per unit in I90DIA34/35): a unit phase I turned down may not sell back above its post-phase-I output in
# ID2–BAL, a unit it raised may not sell below it. Without them the intraday markets undo phase I (27 Oct:
# Dec 2024 ID2–CID ~30 % below the real prices).
security_limits = false
# Where phase I runs: false = after all market stages, on the (saved) DA schedule
# (works with from_saved); true = inside the market chain after each day's DA, as
# in Spain: ID2–BAL start from DA + phase I/II's changes and keep its started
# units on (needs the market stages; intraday prices may move slightly).
in_chain           = false
# Step C: an AC check of every hour on phase I's schedule (day-ahead profile),
# starting units at minimum load where voltage cannot be held (RD9's loop), as
# REE's phase I is an AC security analysis.  What it changes becomes part of
# phase I; real time starts with those units on.  ac_check_zones = false leaves
# out RD5's zone counts (read from REE's 2024 data), so the voltage need comes
# from the AC grid alone.  Phase I after the markets only (not with in_chain).
ac_check           = false
ac_check_zones     = true
# Preventive N-1 in phase I (step RD6): after each solve, every monitored
# branch's flow after each single outage of a ≥ n1_min_kv line/transformer
# (DC outage distribution factors) must stay within n1_emergency_factor × its
# nominal rating; violated ones become constraints and phase I is solved again
# (at most n1_max_rounds rounds, n1_max_cuts constraints per round, worst first).
n1                  = false
n1_emergency_factor = 1.0
n1_min_kv           = 220.0
n1_max_rounds       = 4
n1_max_cuts         = 500
# Post-outage overloads are soft: each MW over costs this (above any bid), so
# redispatch removes every overload it can and the rest is reported
# (rd_phase1_summary.csv n1_overload_left_mw) instead of making the day infeasible.
n1_overload_eur_mwh = 3000.0
# Seasonal post-outage limits (step RD6b, P.O. 1.1 §4.3.2; seasons from RDL
# 17/2022 Annex I): lines × the season's factor (the model's line ratings taken as
# the summer value), transformers +10 % in winter (Nov–Mar).  Default factors
# from a simple conductor heat balance (redispatch_phase1.jl); an assumption.
# What one outage trips: "element" = one circuit of a line or one transformer of a
# bank (P.O. 1.1's N-1; the network merges parallel elements into one branch),
# "branch" = the whole merged branch (as before 21 Oct; e.g. all three 1,000 MVA
# transformers of a bank at once).
n1_outage              = "element"
n1_seasonal_ratings    = false
n1_line_season_factor  = { winter = 1.18, spring = 1.09, summer = 1.0, autumn = 1.09 }
n1_trafo_winter_factor = 1.10

[redispatch.hydro_budget]
# Water budget (step RD13): per hydro unit and day, the redispatch (phase I and real
# time) may not add energy to the schedule — Σ_h (output − schedule) ≤ tolerance_mwh —
# so it can shift hydro between hours and turn it down, but not spend water the
# water plan kept for other days.  REE raised hydro for only 39 of 13,584 GWh of
# phase I up in 2024 (I90), while hydro is 31 % of phase II down.
enabled       = false
tolerance_mwh = 0.0

[redispatch.reserve]
# Upward reserve in the real-time redispatch (step RD7, redispatch_reserve.jl).
# 89 % of REE's 2024 real-time upward redispatch was "too little upward
# reserve".  Per hour the running gas/coal/hydro must keep headroom (maximum −
# output) ≥ REE's assigned aFRR upward band × scale + extra_mw; if they cannot,
# the cheapest offline CCGT/coal units are started (rd_startups.csv, zone =
# "reserve").  Requirement file from redispatch_realism/build_reserve_requirement.py.
# Needs q_requires_online.
enabled          = false
requirement_file = "redispatch_realism/data/reserve_requirement.csv"
scale            = 1.0
extra_mw         = 0.0       # e.g. an mFRR margin on top of the aFRR band
# Stopped reservoir/pumped hydro count as headroom: they synchronise within
# minutes and carry much of the aFRR band, which the market stages do not
# schedule (false: only running units count; more thermal start-ups).
offline_hydro_counts = true
# Step E1 (P.O. 1.5 §4.3): add tertiary reserve to the requirement — the largest
# scheduled single unit + tertiary_demand_share × demand — and, with
# tertiary_ramp15, count a running thermal unit's headroom only up to what it can
# ramp in 15 minutes (Data/power_unit_tech_params.csv).  Writes rd_reserve.csv.
tertiary              = false
tertiary_demand_share = 0.02
tertiary_ramp15       = true

[redispatch.bids]
# Prices for objective = "ree" (steps RD10/RD11, redispatch_objective.jl): REE's
# cost rule, min Σ (bid_up − p_DA)·up + Σ (p_DA − refund)·down + tie_break·moved.
# bid_up = max(cost, p_DA) × (1 + up_markup); reservoir/pumped hydro and
# batteries use p_DA as their cost (opportunity cost).  refund = p_DA
# (down_refund = "da", the phase I rule) or cost × (1 − down_markup) ("bid").
# Mark-ups: to be fitted to REE's 2024 prices per unit (I90, fetch_i90.py);
# add per-type rows as  [[redispatch.bids.by_type]]  type = "Gas:Combined_cycle"
# up_markup = …  down_markup = … .  0.0 = cost-based.
up_markup         = 0.0
down_markup       = 0.0
down_refund       = "da"
tie_break_eur_mwh = 0.5

[midterm]
# ── Mid-term hydro scheduling (in-house Bellman cuts via SDDP) ───────────────
# A 3-zone (FR/ES/PT) weekly hydro-thermal SDDP that computes the Bellman cuts
# itself from Data/smspp_in + Data/ts, replacing the SMS++ output.  Missing
# FR/PT time series are synthesised from the ES shapes rescaled to each unit's
# annual Energy/Capacity.  Run with:  julia --project=. midterm_sddp.jl
# To use its cuts in the market chain, point [bellman].bellman_file and
# volume_file at the two outputs below.
n_stages    = 78         # weekly stages → Timestep 0..77 in the cut file
block_hours = 2          # within-week time step [h]; must divide 24
iterations  = 150        # SDDP training iterations
voll        = 3000.0     # unserved-energy penalty [EUR/MWh]
end_fill    = 1.0        # see [midterm4] below — same meaning
end_penalty = 150.0
solver      = "gurobi"   # "gurobi" | "highs"
sim_year    = 1982       # climate year for the Volume_Scen0 trajectory
year_stride = 1          # use every k-th climate year (1 = all 37 scenarios)
seed        = 1234
cuts_out    = "Data/BellmanValuesOUT_sddp.csv"
volume_out  = "Data/Volume_Scen0_OUT_sddp.csv"

[midterm4]
# ── Mid-term hydro scheduling, 4-node 2024 system (in-house SDDP) ────────────
# ES / PT / FR / EU (rest of Europe) on the real ~2024 system: capacities from
# Data/Generation.csv, NTCs from Data/Transmission.csv, pumped storage from
# Data/Storage.csv, costs from Data/generation_cost_pypsa_2024.csv, and hourly
# EMPIRE series (Data/ts/EMPIRE, 2015–2019 = 5 joint weather scenarios).
# 3 reservoir states (ES, FR, EU); PT turbines a weekly inflow budget.
# Run with:  julia --project=. midterm_sddp4.jl   ("resim" arg → diagnostics)
n_stages    = 78         # weekly stages → Timestep 0..77 in the cut file
block_hours = 2          # within-week time step [h]; must divide 24
iterations  = 60         # SDDP iterations per run (use "cont" arg to add more)
voll        = 3000.0     # unserved-energy penalty [EUR/MWh]
# ── End-of-horizon reservoir target ─────────────────────────────────────────
# SDDP gives the last stage a zero value function, so water is worth nothing
# after stage 78 and the policy empties every reservoir into the horizon end.
# The last stage instead has to reach end_fill × (initial volume) per reservoir
# or pay end_penalty for each missing MWh — a soft target, so a dry final week
# stays feasible.  Expressed against v0 rather than vmax so each zone inherits
# its own starting fill (ES from SS_SeasonalStorage, FR/EU from .reservoir).
#   end_fill    — 1.0 ends the horizon at the starting volume.  The horizon is
#                 78 weeks = 1.5 years (2 Jul 2024 → 30 Dec 2025), so start and
#                 end sit in different seasons; lower it if the late-December
#                 target should be below the early-July level.
#   end_penalty — terminal water value [EUR/MWh].  150 sits above mid-merit
#                 CCGT (~60–100) so the policy refills rather than burning gas
#                 in the final weeks, and far below voll so it never buys water
#                 with load shedding.  0 disables the target entirely.
end_fill    = 1.0
end_penalty = 150.0
solver      = "gurobi"   # "gurobi" | "highs"
sim_year    = 1982       # EDF climate year for the exported volume trajectory
seed        = 1234
cuts_out    = "Data/BellmanValuesOUT_sddp4.csv"
volume_out  = "Data/Volume_Scen0_OUT_sddp4.csv"
# Hourly reservoir turbine schedule (ES/FR/EU, MW) from the simulated policy.
# The market chain integrates the ES column over each study day to get that
# day's reservoir energy budget — see [bellman].turbine_file.
turbine_out = "Data/TurbineSchedule_sddp4.csv"

# ── Spanish seasonal-inflow dataset ─────────────────────────────────────────
# The two available sources disagree on both level and seasonality, and the
# seasonality decides whether the policy releases any water in summer:
#
#             Jun   Jul   Aug   Sep  |  Jun-Sep   annual
#   edf       5.3%  3.0%  1.5%  2.2% |   12.0%    27.08 TWh/yr
#   empire    7.4%  7.8%  5.0%  5.3% |   25.5%    21.86 TWh/yr
#
#   "edf"           — SS_SeasonalStorage Inflows x the EDF weekly coefficient
#                     (39 climate years).  Spain's summer is near-dry, so a
#                     reservoir starting 30 % full releases NOTHING from July to
#                     late October and the market chain gets zero reservoir
#                     hydro on 8 July 2024 (against ~74 GWh actually generated).
#   "empire"        — Data/ts/EMPIRE/hydroseasonal.csv, summed over the 18 ES
#                     NUTS3 columns (5 climate years, 2015-2019), used as-is.
#                     Changes seasonality AND drops the annual total by 19 %.
#   "empire_scaled" — EMPIRE's seasonality rescaled to the SS_SeasonalStorage
#                     annual total, so the shape can be tested on its own.
es_inflow_source = "empire_scaled"

# ── Gas cost of the Iberian fleet ───────────────────────────────────────────
# "config" — the flat [midterm4.gas_cost] figures (ES/PT CCGT 78, OCGT 105).
# "mibgas" — the weekly mean of the OBSERVED daily short-run marginal cost from
#   [costs.gas_srmc] (MIBGAS + EUA).  Over the 78 stages this runs 82.6 to 128.8
#   EUR/MWh (mean 96.4) against the flat 78, and it is SEASONAL: the 2024 gas
#   price nearly doubles from February (25.3) to December (46.3 EUR/MWh_th).
#
# Why this matters more than it looks: the water value IS the gas cost in this
# model, because Spanish reservoir hydro displaces Spanish CCGT — the ES cut
# slopes sit at exactly the ES gas figure.  With a flat cost the water value is
# flat too (76.68 in July vs 73.60 in December — i.e. water is worth LESS in
# winter, which is backwards).  A seasonal gas price makes winter water dearer,
# so the policy saves it, which is the actual driver of seasonal reservoir
# management and something the flat model cannot represent at all.
#
# FR/EU keep their config values: they buy on TTF, not MIBGAS.  The ES [chp]
# blocks are excluded — their offer price is a calibrated bid, not a fuel cost.
#
# CAVEAT: this is a DETERMINISTIC seasonal path, so the policy has perfect
# foresight of the 2024-25 gas market.  Declare it when reporting.  Modelling
# gas as a stochastic autocorrelated process would need it as a STATE variable,
# taking the value function from 3 to 4 dimensions.
gas_price_source = "mibgas"

[midterm4.reservoir]
# Seasonal reservoir sizes (public data): FR ≈ French lakes; EU ≈ Norway 87 +
# Sweden 34 + Alps/Italy ≈ 24 TWh.  fill0 = fraction full at the July start.
vmax_twh = { FR = 3.6, EU = 145.0 }   # ES comes from SS_SeasonalStorage.csv
fill0    = { FR = 0.65, EU = 0.65 }

[midterm4.availability]
# Mean availability (maintenance + forced outages) applied to thermal capacity.
# Nuclear 0.90 is the non-French fleets (Nordics/BE/CZ/CH ran ~85-92 % in 2024);
# the French fleet is overridden per zone below.  Conventional thermal ~90 %.
Nuclear    = 0.90
Coal       = 0.90
Lignite    = 0.90
"Gas CCGT" = 0.90
"Gas OCGT" = 0.95
Oil        = 0.90
Bio        = 0.85
Waste      = 0.85
Geo        = 0.90

[midterm4.availability.FR]
# Zone override: French nuclear ran at ~70 % CF in 2024 (heavy maintenance).
Nuclear    = 0.85

[midterm4.gas_cost]
# Zone-specific 2024 gas marginal cost [EUR/MWh_el]: Iberia buys on MIBGAS
# (~31 EUR/MWh_th) vs TTF (~34) for FR/EU; cost = fuel/eta + CO2 + VOM.
# Replaces the single pypsa CCGT figure (93.16, near-tied with coal 94.01)
# that pinned every zone's marginal price at ~93 EUR/MWh.
ccgt = { ES = 78.0, PT = 78.0, FR = 87.0, EU = 87.0 }
ocgt = { ES = 105.0, PT = 105.0, FR = 117.0, EU = 117.0 }
