# Variant "aligned_observed": the "aligned" policy (same system, same training — reused through
# train_label) simulated from REE's observed start level with the observed inflow index (W2, W4).
# Run "aligned" first; this one only simulates and exports (minutes).
#   HYDRO_STATE_CONFIG=hydro_state/hydro_state_aligned_observed.toml julia --project=. hydro_state/midterm_observed.jl
label = "aligned_observed"
train_label = "aligned"

[system]
es_stage_supply_file = "Data/hydro_state/es_stage_supply_2024.csv"

[observed]
ree_file = "Data/hydro_state/ree_hydro_monthly.csv"
observed_start = true
inflow = "index"

[training]
es_start_fills = [0.20, 0.35, 0.50, 0.65, 0.80, 0.95]
iterations_per_start = 15
