# Variant "ree_rc": "aligned_rc" (weekly ES supply + REE 2014–2023 rule curves) with the ES
# inflow the SDDP trains on switched from EMPIRE's seasonality to EDF's climate years rescaled
# to REE's 2014–2023 monthly shape ("edf_ree"). Dataset start (30 %) and the replayed climate
# year, as "aligned_rc", so the A/B against it isolates the inflow shape.
#   HYDRO_STATE_CONFIG=hydro_state/hydro_state_ree_rc.toml julia --project=. hydro_state/midterm_observed.jl
label = "ree_rc"

[system]
es_stage_supply_file = "Data/hydro_state/es_stage_supply_2024.csv"
es_rule_curve_file = "Data/hydro_state/es_rule_curves_2014_2023.csv"
es_inflow_source = "edf_ree"
es_inflow_ree_file = "Data/hydro_state/ree_hydro_monthly.csv"

[observed]
ree_file = "Data/hydro_state/ree_hydro_monthly.csv"
observed_start = false
inflow = "climate_year"

[training]
es_start_fills = [0.20, 0.35, 0.50, 0.65, 0.80, 0.95]
iterations_per_start = 15
